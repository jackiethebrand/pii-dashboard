<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretty in Ink — Inquiry Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #D4748F;
  --pink-lt: #F2C8D4;
  --cream: #FDF7F5;
  --ink: #1C1213;
  --gray: #6b7280;
  --gray-lt: #f3f4f6;
  --border: #e8dcd8;
  --white: #ffffff;
  --gold: #a1005a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); }

/* ── NAV ── */
.header {
  background: var(--ink); color: var(--white); padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--pink-lt); }
.header nav { display: flex; gap: 8px; }
.header nav a {
  color: rgba(255,255,255,0.75); text-decoration: none; font-size: 12.5px;
  padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2);
}
.header nav a:hover { background: rgba(255,255,255,0.1); }
.header nav a.active { background: var(--pink-lt); color: var(--ink); border-color: var(--pink-lt); }

/* ── TOOLBAR ── */
.toolbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.toolbar-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; font-style: italic; flex: 1; min-width: 120px; }
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-group label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.4px; }
.filter-group select {
  padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: inherit; background: white; cursor: pointer;
}
.filter-group select:focus { outline: none; border-color: var(--pink); }
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--border);
  font-size: 12.5px; font-weight: 600; background: white; cursor: pointer; color: var(--gray);
  transition: all 0.15s;
}
.pill.active { background: var(--pink); border-color: var(--pink); color: white; }
.pill:hover:not(.active) { border-color: var(--pink); color: var(--ink); }
.pill .cnt { font-size: 11px; margin-left: 3px; opacity: 0.8; }

/* ── STATE SCREENS ── */
.state-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 40vh; gap: 12px; color: var(--gray); font-size: 14px;
}
.spinner {
  width: 30px; height: 30px; border: 3px solid var(--pink-lt);
  border-top-color: var(--pink); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── LIST ── */
.list-wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }

.section-group { margin-bottom: 28px; }
.section-head {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--gray); margin-bottom: 10px; padding: 0 2px;
  display: flex; align-items: center; gap: 6px;
}
.section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── INQUIRY CARD — appointment-style compact ── */
.inquiry-row {
  background: var(--white);
  border: 1px solid var(--border);
  border-left: 4px solid var(--pink);
  border-radius: 10px;
  padding: 12px 16px 12px 14px;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.inquiry-row:hover { box-shadow: 0 2px 10px rgba(212,116,143,0.15); border-color: var(--pink); }
.inquiry-row.their-turn { border-left-color: var(--border); }
.inquiry-row.their-turn:hover { border-left-color: var(--gray); border-color: var(--border); }

.row-body { flex: 1; min-width: 0; }
.row-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
.row-sub { font-size: 11.5px; color: var(--gray); margin-top: 3px; }
.row-chips { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.chip-sm {
  font-size: 11.5px; padding: 2px 9px; border-radius: 6px;
  background: var(--gray-lt); border: 1px solid var(--border); color: var(--ink);
  white-space: nowrap;
}
.chip-sm.coverup { background: var(--cream); border-color: var(--pink-lt); color: var(--gold); }

.row-aside { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }

/* status chips */
.st {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
}
.st.new        { background: #ede9fe; color: #5b21b6; }
.st.in-progress { background: #dbeafe; color: #1d4ed8; }
.st.quoted     { background: #d1fae5; color: #065f46; }
.st.booked     { background: #d1fae5; color: #065f46; }
.st.closed     { background: var(--gray-lt); color: var(--gray); }
.st.default    { background: var(--gray-lt); color: var(--gray); }

.row-arrow { font-size: 16px; color: var(--border); }
</style>
</head>
<body>

<div class="header">
  <h1>Pretty in Ink</h1>
  <nav>
    <a href="pii-inquiry-inbox.html" class="active">Inquiries</a>
    <a href="pii-appointments.html">Appointments</a>
    <a href="pii-correspondence.html">Correspondence</a>
  </nav>
</div>

<div class="toolbar">
  <div class="toolbar-title">Inquiry Inbox</div>
  <div class="filter-group">
    <label>Artist</label>
    <select id="artistFilter" onchange="applyFilters()">
      <option value="">All artists</option>
      <option>Tressa</option>
      <option>Jackie</option>
    </select>
  </div>
  <div class="filter-pills" id="statusPills">
    <button class="pill active" data-status="" onclick="setPillFilter(this)">All <span class="cnt" id="cntAll"></span></button>
    <button class="pill" data-status="new" onclick="setPillFilter(this)">New <span class="cnt" id="cntNew"></span></button>
    <button class="pill" data-status="in-progress" onclick="setPillFilter(this)">In Progress <span class="cnt" id="cntInProgress"></span></button>
    <button class="pill" data-status="quoted" onclick="setPillFilter(this)">Quoted <span class="cnt" id="cntQuoted"></span></button>
    <button class="pill" data-status="booked" onclick="setPillFilter(this)">Booked <span class="cnt" id="cntBooked"></span></button>
  </div>
</div>

<div class="list-wrap">
  <div class="state-screen" id="stateScreen">
    <div class="spinner"></div>
    <div>Loading inquiries…</div>
  </div>
  <div id="listContent" style="display:none;"></div>
</div>

<script>
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbwUU2aV5fMpjMWieN8j28pnRW8B4ZgjepdVgONbTKzbONETzmUsjKT-JswnwnT_13Eq/exec';

const urlParams     = new URLSearchParams(location.search);
const DEFAULT_ARTIST = urlParams.get('artist') || '';

let allInquiries = [];
let activeStatus = '';
let cbId = 0;

// ── JSONP ────────────────────────────────────────────────────
function jsonp(url) {
  return new Promise(function(resolve, reject) {
    var cb    = 'piiInbox_' + (++cbId);
    var sep   = url.includes('?') ? '&' : '?';
    var el    = document.createElement('script');
    el.src    = url + sep + 'callback=' + cb;
    var timer = setTimeout(function() { cleanup(); reject(new Error('Timed out')); }, 25000);
    window[cb] = function(data) { cleanup(); clearTimeout(timer); resolve(data); };
    el.onerror = function() { cleanup(); clearTimeout(timer); reject(new Error('Network error')); };
    function cleanup() { if (el.parentNode) el.parentNode.removeChild(el); delete window[cb]; }
    document.head.appendChild(el);
  });
}

// ── INIT ─────────────────────────────────────────────────────
async function initFixed() {
  if (DEFAULT_ARTIST) document.getElementById('artistFilter').value = DEFAULT_ARTIST;
  var artist = document.getElementById('artistFilter').value;
  try {
    var res = await jsonp(EXEC_URL + '?action=getInquiries&artist=' + encodeURIComponent(artist) + '&status=');
    if (!res.success) { showState('Could not load inquiries: ' + (res.error || '')); return; }
    allInquiries = res.inquiries || [];
    updateCounts();
    renderList();
  } catch (e) {
    showState('Error: ' + e.message);
  }
}

function showState(msg) {
  document.getElementById('stateScreen').innerHTML =
    '<div style="color:var(--gray);text-align:center;padding:20px;">' + msg + '</div>';
  document.getElementById('stateScreen').style.display = 'flex';
  document.getElementById('listContent').style.display = 'none';
}

// ── FILTERS ──────────────────────────────────────────────────
function setPillFilter(el) {
  document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
  el.classList.add('active');
  activeStatus = el.dataset.status;
  renderList();
}

async function applyFilters() {
  document.getElementById('stateScreen').innerHTML = '<div class="spinner"></div><div>Loading…</div>';
  document.getElementById('stateScreen').style.display = 'flex';
  document.getElementById('listContent').style.display = 'none';
  await initFixed();
}

function updateCounts() {
  var counts = { '': 0, 'new': 0, 'in-progress': 0, 'quoted': 0, 'booked': 0 };
  allInquiries.forEach(function(inq) {
    counts['']++;
    if (counts[inq.status] !== undefined) counts[inq.status]++;
  });
  setCount('cntAll', counts['']);
  setCount('cntNew', counts['new']);
  setCount('cntInProgress', counts['in-progress']);
  setCount('cntQuoted', counts['quoted']);
  setCount('cntBooked', counts['booked']);
}
function setCount(id, n) {
  var el = document.getElementById(id);
  if (el) el.textContent = n > 0 ? n : '';
}

// ── RENDER ───────────────────────────────────────────────────
function renderList() {
  var list   = document.getElementById('listContent');
  var screen = document.getElementById('stateScreen');

  var filtered = allInquiries.filter(function(inq) {
    if (activeStatus && inq.status !== activeStatus) return false;
    return true;
  });

  if (!filtered.length) {
    showState('No inquiries match these filters.');
    return;
  }

  screen.style.display = 'none';
  list.style.display = 'block';

  var yourTurn  = filtered.filter(function(i) { return i.needsReply === true; });
  var theirTurn = filtered.filter(function(i) { return i.needsReply === false; });
  var closed    = filtered.filter(function(i) { return i.needsReply === null || i.needsReply === undefined; });

  var html = '';

  if (yourTurn.length) {
    html += '<div class="section-group">';
    html += '<div class="section-head">👋 Your Turn &nbsp;·&nbsp; ' + yourTurn.length + ' awaiting response</div>';
    yourTurn.forEach(function(inq) { html += rowHtml(inq, false); });
    html += '</div>';
  }
  if (theirTurn.length) {
    html += '<div class="section-group">';
    html += '<div class="section-head">⏳ Their Turn &nbsp;·&nbsp; ' + theirTurn.length + ' waiting on client</div>';
    theirTurn.forEach(function(inq) { html += rowHtml(inq, true); });
    html += '</div>';
  }
  if (closed.length) {
    html += '<div class="section-group">';
    html += '<div class="section-head" style="color:#9ca3af;">Closed / Archived &nbsp;·&nbsp; ' + closed.length + '</div>';
    closed.forEach(function(inq) { html += rowHtml(inq, true); });
    html += '</div>';
  }

  list.innerHTML = html;
}

function rowHtml(inq, theirTurn) {
  var href = 'pii-inquiry-thread.html?inquiryId=' + encodeURIComponent(inq.inquiryId) +
    (inq.artist ? '&artist=' + encodeURIComponent(inq.artist) : '');

  var submittedLabel = inq.submittedAt
    ? new Date(inq.submittedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    : '';

  var subParts = [];
  if (inq.source)      subParts.push(escHtml(inq.source));
  if (inq.artist)      subParts.push(escHtml(inq.artist));
  if (submittedLabel)  subParts.push('Submitted ' + submittedLabel);
  var subLine = subParts.join(' · ');

  var chips = '';
  if (inq.placement)    chips += '<span class="chip-sm">' + escHtml(inq.placement) + '</span>';
  if (inq.style)        chips += '<span class="chip-sm">' + escHtml(inq.style) + '</span>';
  if (inq.sizeEstimate) chips += '<span class="chip-sm">' + escHtml(inq.sizeEstimate) + '</span>';
  if (inq.isCoverup)    chips += '<span class="chip-sm coverup">Coverup</span>';

  // Status label
  var stLabel = inq.status === 'quoted' ? '✓ Quote Sent' :
                inq.status === 'in-progress' ? 'In Progress' :
                inq.status ? inq.status.charAt(0).toUpperCase() + inq.status.slice(1) : 'New';
  var stClass = inq.status || 'new';

  return '<a class="inquiry-row' + (theirTurn ? ' their-turn' : '') + '" href="' + escHtml(href) + '">' +
    '<div class="row-body">' +
      '<div class="row-name">' + escHtml(inq.clientName || inq.clientId || '—') + '</div>' +
      (subLine ? '<div class="row-sub">' + subLine + '</div>' : '') +
      (chips   ? '<div class="row-chips">' + chips + '</div>' : '') +
    '</div>' +
    '<div class="row-aside">' +
      '<span class="st ' + escHtml(stClass) + '">' + escHtml(stLabel) + '</span>' +
    '</div>' +
    '<span class="row-arrow">›</span>' +
  '</a>';
}

function escHtml(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initFixed();
</script>
</body>
</html>
