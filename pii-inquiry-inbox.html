<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretty in Ink — Inquiry Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #D4748F;
  --pink-lt: #F2C8D4;
  --cream: #FDF7F5;
  --ink: #1C1213;
  --gray: #6b7280;
  --gray-lt: #f3f4f6;
  --border: #e8dcd8;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); }

/* ── NAV ── */
.header {
  background: var(--ink); color: var(--white); padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--pink-lt); }
.header nav { display: flex; gap: 8px; }
.header nav a {
  color: rgba(255,255,255,0.75); text-decoration: none; font-size: 12.5px;
  padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2);
}
.header nav a:hover { background: rgba(255,255,255,0.1); }
.header nav a.active { background: var(--pink-lt); color: var(--ink); border-color: var(--pink-lt); }

/* ── HERO ── */
.hero { text-align: center; padding: 36px 24px 20px; }
.hero-eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--pink); margin-bottom: 8px; }
.hero h2 { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 400; line-height: 1.1; }
.hero h2 em { font-style: italic; color: var(--pink); }
.hero-sub { color: var(--gray); font-size: 14px; margin-top: 6px; }
.hero-rule { width: 50px; height: 2px; background: var(--pink-lt); margin: 14px auto 0; border-radius: 2px; }

/* ── WRAPPER ── */
.page-wrap { max-width: 920px; margin: 0 auto; padding: 0 20px 60px; }

/* ── TOOLBAR ── */
.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; }
.updated-label { font-size: 12px; color: var(--gray); }
.btn-refresh {
  background: var(--white); border: 1.5px solid var(--border); border-radius: 999px;
  padding: 7px 16px; font-size: 12.5px; font-family: inherit; cursor: pointer; color: var(--ink);
  display: flex; align-items: center; gap: 5px;
}
.btn-refresh:hover { border-color: var(--pink); color: var(--pink); }

/* ── FILTERS ── */
.filters { padding: 14px 0 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-select {
  padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 999px;
  font-size: 13px; font-family: inherit; background: var(--white); color: var(--ink); cursor: pointer;
}
.filter-select:focus { outline: none; border-color: var(--pink); }
.pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 999px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--white); color: var(--gray);
  transition: all 0.15s;
}
.pill:hover { border-color: var(--pink); color: var(--pink); }
.pill.active { background: var(--pink); border-color: var(--pink); color: white; }
.pill-count { font-size: 11px; opacity: 0.75; margin-left: 4px; }

/* ── SECTION HEADERS ── */
.section-head { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px; }
.section-head-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-style: italic; font-weight: 400; color: var(--ink); white-space: nowrap;
}
.section-head-count {
  font-size: 12px; font-weight: 700; color: var(--gray);
  background: var(--gray-lt); border-radius: 999px; padding: 2px 9px;
}
.section-head-line { flex: 1; height: 1px; background: var(--border); }

/* ── CARD GRID ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 4px;
}
@media (max-width: 600px) {
  .card-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ── INQUIRY CARD ── */
.inquiry-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-top: 3px solid var(--pink);
  border-radius: 10px;
  padding: 13px 13px 11px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: box-shadow 0.15s, transform 0.1s;
}
.inquiry-card:hover { box-shadow: 0 4px 14px rgba(212,116,143,0.18); transform: translateY(-1px); }
.inquiry-card.their-turn { border-top-color: var(--border); }
.inquiry-card.their-turn:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.07); }

.card-top { display: flex; align-items: center; gap: 8px; }
.card-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: var(--pink-lt); color: var(--pink); font-weight: 700; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.card-avatar.their { background: var(--gray-lt); color: var(--gray); }
.card-name { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.card-meta {
  font-size: 11.5px; color: var(--gray); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.status-pill {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
}
.status-new      { background: #e0f2fe; color: #0369a1; }
.status-quoted   { background: #d1fae5; color: #065f46; }
.status-booked   { background: #ede9fe; color: #5b21b6; }
.status-progress { background: #fef9c3; color: #713f12; }
.status-closed, .status-archived { background: var(--gray-lt); color: var(--gray); }
.quote-badge {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  background: #d1fae5; color: #065f46; white-space: nowrap;
}
.card-date { font-size: 11px; color: var(--gray); margin-left: auto; }

/* ── LOADING / ERROR ── */
.loading-msg { text-align: center; padding: 48px 0; color: var(--gray); font-size: 14px; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--pink-lt); border-top-color: var(--pink); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { color: var(--gray); font-size: 13.5px; padding: 12px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>Pretty in Ink</h1>
  <nav>
    <a href="pii-inquiry-inbox.html" class="active">Inquiries</a>
    <a href="pii-appointments.html">Appointments</a>
    <a href="pii-correspondence.html">Correspondence</a>
  </nav>
</div>

<div class="hero">
  <div class="hero-eyebrow">Pretty in Ink Tattoos</div>
  <h2 id="heroTitle">Inquiry <em>Inbox</em></h2>
  <div class="hero-sub" id="heroSub">Loading…</div>
  <div class="hero-rule"></div>
</div>

<div class="page-wrap">

  <div class="toolbar">
    <div class="updated-label" id="updatedLabel"></div>
    <button class="btn-refresh" onclick="loadInquiries()">↻ Refresh</button>
  </div>

  <div class="filters">
    <select class="filter-select" id="artistFilter" onchange="loadInquiries()">
      <option value="">All Artists</option>
      <option value="Tressa">Tressa</option>
      <option value="Jackie">Jackie</option>
    </select>
    <div class="pill-group">
      <button class="pill active" data-filter="all"       onclick="setPill(this)">All <span class="pill-count" id="cAll"></span></button>
      <button class="pill"        data-filter="new"       onclick="setPill(this)">New <span class="pill-count" id="cNew"></span></button>
      <button class="pill"        data-filter="yourturn"  onclick="setPill(this)">Your Turn <span class="pill-count" id="cYourTurn"></span></button>
      <button class="pill"        data-filter="theirturn" onclick="setPill(this)">Their Turn <span class="pill-count" id="cTheirTurn"></span></button>
      <button class="pill"        data-filter="quoted"    onclick="setPill(this)">Quoted <span class="pill-count" id="cQuoted"></span></button>
      <button class="pill"        data-filter="booked"    onclick="setPill(this)">Booked <span class="pill-count" id="cBooked"></span></button>
    </div>
  </div>

  <div id="listWrap">
    <div class="loading-msg"><div class="spinner"></div>Loading inquiries…</div>
  </div>

</div>

<script>
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbwUU2aV5fMpjMWieN8j28pnRW8B4ZgjepdVgONbTKzbONETzmUsjKT-JswnwnT_13Eq/exec';

var allInquiries = [];
var activeFilter = 'all';
var cbId = 0;

function jsonp(url) {
  return new Promise(function(resolve, reject) {
    var cb  = 'piiInbox_' + (++cbId);
    var el  = document.createElement('script');
    el.src  = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    var timer = setTimeout(function() { cleanup(); reject(new Error('Timed out')); }, 25000);
    window[cb] = function(data) { cleanup(); clearTimeout(timer); resolve(data); };
    el.onerror = function() { cleanup(); clearTimeout(timer); reject(new Error('Network error — check Apps Script deployment')); };
    function cleanup() { if (el.parentNode) el.parentNode.removeChild(el); delete window[cb]; }
    document.head.appendChild(el);
  });
}

function apiGet(action, extra) {
  var q  = Object.assign({ action: action }, extra || {});
  var qs = Object.keys(q).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(q[k]); }).join('&');
  return jsonp(EXEC_URL + '?' + qs);
}

async function loadInquiries() {
  document.getElementById('listWrap').innerHTML = '<div class="loading-msg"><div class="spinner"></div>Loading inquiries…</div>';
  document.getElementById('updatedLabel').textContent = '';
  var artist = document.getElementById('artistFilter').value;
  try {
    var res = await apiGet('getInquiries', { artist: artist, status: '' });
    if (!res.success) { showError(res.error || 'Failed to load'); return; }
    allInquiries = res.inquiries || [];
    document.getElementById('updatedLabel').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    document.getElementById('heroTitle').innerHTML = artist
      ? escHtml(artist) + '\'s <em>Inquiries</em>'
      : 'Inquiry <em>Inbox</em>';
    renderList();
  } catch(e) { showError(e.message); }
}

function getFiltered() {
  return allInquiries.filter(function(i) {
    if (activeFilter === 'all')       return i.status !== 'closed' && i.status !== 'archived';
    if (activeFilter === 'new')       return i.status === 'new';
    if (activeFilter === 'yourturn')  return i.needsReply === true;
    if (activeFilter === 'theirturn') return i.needsReply === false;
    if (activeFilter === 'quoted')    return i.status === 'quoted';
    if (activeFilter === 'booked')    return i.status === 'booked';
    return true;
  });
}

function renderList() {
  var open     = allInquiries.filter(function(i){ return i.status !== 'closed' && i.status !== 'archived'; });
  var filtered = getFiltered();

  document.getElementById('cAll').textContent       = open.length;
  document.getElementById('cNew').textContent       = open.filter(function(i){ return i.status==='new'; }).length;
  document.getElementById('cYourTurn').textContent  = open.filter(function(i){ return i.needsReply===true; }).length;
  document.getElementById('cTheirTurn').textContent = open.filter(function(i){ return i.needsReply===false; }).length;
  document.getElementById('cQuoted').textContent    = open.filter(function(i){ return i.status==='quoted'; }).length;
  document.getElementById('cBooked').textContent    = open.filter(function(i){ return i.status==='booked'; }).length;

  var openCount = filtered.filter(function(i){ return i.status!=='closed'&&i.status!=='archived'; }).length;
  document.getElementById('heroSub').textContent = openCount + ' open inquir' + (openCount===1?'y':'ies');

  var yourTurn  = filtered.filter(function(i){ return i.needsReply===true; });
  var theirTurn = filtered.filter(function(i){ return i.needsReply===false; });
  var closed    = filtered.filter(function(i){ return i.needsReply===null||i.needsReply===undefined; });

  var html = '';
  if (!filtered.length) {
    html = '<div class="empty-state">No inquiries match these filters.</div>';
  } else {
    if (yourTurn.length) {
      html += sectionHead('Your Turn', yourTurn.length);
      html += '<div class="card-grid">' + yourTurn.map(function(i){ return cardHtml(i, false); }).join('') + '</div>';
    }
    if (theirTurn.length) {
      html += sectionHead('Their Turn', theirTurn.length);
      html += '<div class="card-grid">' + theirTurn.map(function(i){ return cardHtml(i, true); }).join('') + '</div>';
    }
    if (closed.length) {
      html += sectionHead('Closed / Archived', closed.length);
      html += '<div class="card-grid">' + closed.map(function(i){ return cardHtml(i, true); }).join('') + '</div>';
    }
  }
  document.getElementById('listWrap').innerHTML = html;
}

function sectionHead(label, count) {
  return '<div class="section-head">' +
    '<span class="section-head-label">' + escHtml(label) + '</span>' +
    '<span class="section-head-count">' + count + '</span>' +
    '<span class="section-head-line"></span>' +
  '</div>';
}

function cardHtml(inq, theirTurn) {
  var initials = (inq.clientName||'?').split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase();
  var href = 'pii-inquiry-thread.html?inquiryId=' + encodeURIComponent(inq.inquiryId) +
             (inq.artist ? '&artist=' + encodeURIComponent(inq.artist) : '');
  var metaParts = [inq.placement, inq.style, inq.artist].filter(Boolean).join(' · ');
  var statusClass = {
    'new':'status-new','in_progress':'status-progress','quoted':'status-quoted',
    'booked':'status-booked','closed':'status-closed','archived':'status-archived'
  }[inq.status] || 'status-new';
  var quoteBadge = inq.status==='quoted' ? '<span class="quote-badge">✓ Quote Sent</span>' : '';
  var dateLabel  = inq.submittedAt ? new Date(inq.submittedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';

  return '<a class="inquiry-card' + (theirTurn?' their-turn':'') + '" href="' + escHtml(href) + '">' +
    '<div class="card-top">' +
      '<div class="card-avatar' + (theirTurn?' their':'') + '">' + escHtml(initials) + '</div>' +
      '<div class="card-name">' + escHtml(inq.clientName||inq.clientId||'—') + '</div>' +
    '</div>' +
    '<div class="card-meta">' + escHtml(metaParts||'—') + '</div>' +
    '<div class="card-bottom">' +
      (quoteBadge || '<span class="status-pill ' + statusClass + '">' + escHtml(inq.status) + '</span>') +
      (dateLabel ? '<span class="card-date">' + escHtml(dateLabel) + '</span>' : '') +
    '</div>' +
  '</a>';
}

function setPill(btn) {
  document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
  activeFilter = btn.getAttribute('data-filter');
  renderList();
}

function showError(msg) {
  document.getElementById('listWrap').innerHTML = '<div class="loading-msg" style="color:#b91c1c;">' + escHtml(msg) + '</div>';
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadInquiries();
</script>
</body>
</html>
