<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afterpay Dashboard — Pretty in Ink</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:       #3D9970;
  --green-dark:  #2A7A56;
  --green-light: #E8F5EF;
  --green-mid:   #A8D8C0;
  --cream:       #F5FBF7;
  --white:       #FFFFFF;
  --ink:         #141F1A;
  --ink-soft:    #3D5247;
  --chrome:      #8AAF9A;
  --border:      rgba(61,153,112,0.15);
  --shadow-sm:   0 2px 12px rgba(42,122,86,0.08);
  --shadow-md:   0 6px 32px rgba(42,122,86,0.14);
  --shadow-lg:   0 16px 56px rgba(42,122,86,0.20);

  --jackie:      #D4748F;  --jackie-bg:   #FDF0F3;  --jackie-mid:  #F2C8D4;
  --nicole:      #8B6BB5;  --nicole-bg:   #F5F0FC;  --nicole-mid:  #D8C8F0;
  --tressa:      #D4853A;  --tressa-bg:   #FDF4ED;  --tressa-mid:  #F5D4B0;
  --rosa:        #5A9E6F;  --rosa-bg:     #F0F8F3;  --rosa-mid:    #BCE0C8;
  --mellissa:    #4A90C4;  --mellissa-bg: #EFF6FC;  --mellissa-mid:#B8D8F0;
}

html, body {
  min-height: 100vh;
  background: var(--cream);
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(ellipse at 85% 0%, rgba(61,153,112,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 5% 85%, rgba(61,153,112,0.08) 0%, transparent 45%),
    var(--cream);
  padding-bottom: 80px;
}

/* ── HEADER ── */
.header {
  padding: 48px 32px 32px;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px;
}

.studio-label {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  letter-spacing: 0.2em;
  color: var(--green);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(32px, 5vw, 52px);
  line-height: 1;
  color: var(--ink);
  letter-spacing: -0.01em;
}

.header h1 em { font-style: italic; color: var(--green); }

.header-meta {
  font-size: 12px;
  color: var(--chrome);
  margin-top: 8px;
  font-weight: 300;
  letter-spacing: 0.06em;
}

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.nav-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--white);
  border: 1.5px solid var(--green-mid);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
  text-decoration: none;
  letter-spacing: 0.06em;
  transition: all 0.18s;
}

.nav-link:hover { border-color: var(--green); color: var(--green); transform: translateY(-1px); }

.refresh-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: var(--white);
  border: 1.5px solid var(--green-mid);
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.18s;
  box-shadow: var(--shadow-sm);
}

.refresh-btn:hover { border-color: var(--green); color: var(--green); transform: translateY(-1px); }
.refresh-btn.spinning .refresh-icon { animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.last-updated { font-size: 10px; color: var(--chrome); letter-spacing: 0.08em; text-align: right; }

/* ── STATS BAR ── */
.stats-bar {
  max-width: 1200px;
  margin: 0 auto 28px;
  padding: 0 32px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}

.stat-card {
  background: var(--white);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green-mid), var(--green));
}

.stat-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--chrome); font-weight: 500; margin-bottom: 6px; }
.stat-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--ink); line-height: 1; }
.stat-sub   { font-size: 11px; color: var(--chrome); margin-top: 4px; font-weight: 300; }

/* ── FILTER BAR ── */
.filter-bar {
  max-width: 1200px;
  margin: 0 auto 16px;
  padding: 0 32px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chrome); font-weight: 500; margin-right: 4px; }

.filter-btn {
  padding: 7px 16px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.filter-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.filter-btn.active { font-weight: 500; border-width: 2px; color: var(--white); }
.filter-btn[data-artist="all"].active      { background: var(--ink); border-color: var(--ink); }
.filter-btn[data-artist="Jackie"].active   { background: var(--jackie);   border-color: var(--jackie); }
.filter-btn[data-artist="Nicole"].active   { background: var(--nicole);   border-color: var(--nicole); }
.filter-btn[data-artist="Tressa"].active   { background: var(--tressa);   border-color: var(--tressa); }
.filter-btn[data-artist="Rosa"].active     { background: var(--rosa);     border-color: var(--rosa); }
.filter-btn[data-artist="Mellissa"].active { background: var(--mellissa); border-color: var(--mellissa); }

.filter-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

/* ── TABS ── */
.tabs {
  max-width: 1200px;
  margin: 0 auto 20px;
  padding: 0 32px;
  display: flex;
  gap: 6px;
}

.tab-btn {
  padding: 8px 20px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
}

.tab-btn.active { background: var(--green-dark); border-color: var(--green-dark); color: var(--white); font-weight: 500; }

/* ── GRID ── */
.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 32px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

/* ── CLIENT CARD ── */
.client-card {
  background: var(--white);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
  cursor: pointer;
  animation: fadeUp 0.35s ease both;
}

.client-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.card-accent  { height: 5px; width: 100%; }
.card-body    { padding: 20px 22px 18px; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}

.client-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.1;
}

.artist-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 5px;
}

.appt-chip { text-align: right; flex-shrink: 0; }
.appt-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--chrome); margin-bottom: 2px; }
.appt-date  { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 400; color: var(--ink-soft); }
.appt-soon  { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

/* ── AMOUNT ROW ── */
.amount-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.amount-block {
  border-radius: 10px;
  padding: 10px 12px;
}

.amount-block-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 2px; font-weight: 500; }
.amount-block-value { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; line-height: 1; }

/* ── STATUS PILLS ── */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
}

.status-active   { background: var(--green-light); color: var(--green-dark); }
.status-paid     { background: #E8F5EF; color: var(--green-dark); }
.status-archived { background: #F0F0F8; color: #7B6BA0; }
.status-deleted  { background: #FDF0F0; color: #C97070; }
.status-overdue  { background: #FDF0F0; color: #C97070; }

.urgent   { color: #C97070 !important; }
.soon     { color: var(--tressa)  !important; }
.upcoming { color: var(--chrome)  !important; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20,31,26,0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(4px);
}

.modal-box {
  background: var(--white);
  border-radius: 20px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.25s ease;
}

@keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }

/* ── STATE ── */
.state-container { max-width: 1200px; margin: 60px auto; padding: 0 32px; text-align: center; }
.state-icon  { font-size: 40px; margin-bottom: 16px; }
.state-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--ink); margin-bottom: 8px; }
.state-sub   { font-size: 13px; color: var(--chrome); font-weight: 300; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .header    { padding: 32px 16px 24px; }
  .stats-bar, .filter-bar, .grid, .tabs { padding: 0 16px; }
  .grid      { grid-template-columns: 1fr; }
  .header h1 { font-size: 32px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="studio-label">Pretty in Ink Tattoos</div>
    <h1>Afterpay <em>Dashboard</em></h1>
    <div class="header-meta" id="header-meta">Loading...</div>
  </div>
  <div class="header-right">
    <div class="nav-row">
      <a href="index.html" class="nav-link">🏠 Home</a>
  <a href="pii-afterpay-calculator.html" class="nav-link">🧾 New Afterpay</a>
      <a href="pii-dashboard.html" class="nav-link">💗 Layaway</a>
      <a href="pii-afterpay-calculator.html" class="nav-link">🧮 AP Calc</a>
      <button class="refresh-btn" onclick="loadDashboard()">
        <span class="refresh-icon">↻</span> Refresh
      </button>
    </div>
    <div class="last-updated" id="last-updated"></div>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar" id="stats-bar"></div>

<!-- FILTER -->
<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" data-artist="all"      onclick="filterBy('all')">All Artists</button>
  <button class="filter-btn" data-artist="Jackie"   onclick="filterBy('Jackie')"><span class="filter-dot" style="background:var(--jackie)"></span>Jackie</button>
  <button class="filter-btn" data-artist="Nicole"   onclick="filterBy('Nicole')"><span class="filter-dot" style="background:var(--nicole)"></span>Nicole</button>
  <button class="filter-btn" data-artist="Tressa"   onclick="filterBy('Tressa')"><span class="filter-dot" style="background:var(--tressa)"></span>Tressa</button>
  <button class="filter-btn" data-artist="Rosa"     onclick="filterBy('Rosa')"><span class="filter-dot" style="background:var(--rosa)"></span>Rosa</button>
  <button class="filter-btn" data-artist="Mellissa" onclick="filterBy('Mellissa')"><span class="filter-dot" style="background:var(--mellissa)"></span>Mellissa</button>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" id="tab-active"   onclick="switchTab('active')">Active</button>
  <button class="tab-btn"        id="tab-archived" onclick="switchTab('archived')">Archived</button>
  <button class="tab-btn"        id="tab-deleted"  onclick="switchTab('deleted')">Deleted</button>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>
<div id="state-area"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbz3XojZzUAH30F1CK1qyBvsDd-zCe2KACv3_ZcigpPnuacZGJj-AURRN4t6TlqOQLpK/exec";

const ARTISTS = {
  Jackie:   { color: 'var(--jackie)',   bg: 'var(--jackie-bg)',   mid: 'var(--jackie-mid)'   },
  Nicole:   { color: 'var(--nicole)',   bg: 'var(--nicole-bg)',   mid: 'var(--nicole-mid)'   },
  Tressa:   { color: 'var(--tressa)',   bg: 'var(--tressa-bg)',   mid: 'var(--tressa-mid)'   },
  Rosa:     { color: 'var(--rosa)',     bg: 'var(--rosa-bg)',     mid: 'var(--rosa-mid)'     },
  Mellissa: { color: 'var(--mellissa)', bg: 'var(--mellissa-bg)', mid: 'var(--mellissa-mid)' },
};

let allClients    = [];
let activeFilter  = 'all';
let activeTab     = 'active';

// ── LOAD ──
async function loadDashboard() {
  setRefreshing(true);
  showState('loading');
  try {
    const res = await jsonp(SHEET_URL + '?action=getAfterPayClients');
    if (res.status !== 'ok') throw new Error('failed');

    allClients = (res.clients || []).sort((a, b) => {
      const da = a['Appointment Date'] ? new Date(a['Appointment Date']) : new Date('9999-12-31');
      const db = b['Appointment Date'] ? new Date(b['Appointment Date']) : new Date('9999-12-31');
      return da - db;
    });

    renderStats();
    renderGrid(activeFilter);
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
    document.getElementById('header-meta').textContent =
      allClients.filter(c => c['Status'] === 'Active').length + ' active invoice(s) · ' +
      new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  } catch(e) {
    showState('error');
  } finally {
    setRefreshing(false);
  }
}

// ── STATS ──
function renderStats() {
  const active     = allClients.filter(c => c['Status'] === 'Active');
  const totalOwed  = active.reduce((s,c) => s + (parseFloat(c['Invoice Total'])||0), 0);
  const urgent     = active.filter(c => { const d = daysUntil(c['Appointment Date']); return d !== null && d >= 0 && d <= 7; }).length;
  const thisMonth  = active.filter(c => { const d = daysUntil(c['Appointment Date']); return d !== null && d >= 0 && d <= 30; }).length;

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Active Invoices</div><div class="stat-value">${active.length}</div><div class="stat-sub">awaiting payment</div></div>
    <div class="stat-card"><div class="stat-label">Total Outstanding</div><div class="stat-value">${fmt(totalOwed)}</div><div class="stat-sub">in Afterpay invoices</div></div>
    <div class="stat-card"><div class="stat-label">Due This Month</div><div class="stat-value">${thisMonth}</div><div class="stat-sub">appointments in 30 days</div></div>
    <div class="stat-card"><div class="stat-label">Urgent</div><div class="stat-value" style="color:${urgent>0?'#C97070':'var(--ink)'}">${urgent}</div><div class="stat-sub">appointments within 7 days</div></div>
  `;
}

// ── RENDER GRID ──
function renderGrid(filter) {
  const grid      = document.getElementById('grid');
  const stateArea = document.getElementById('state-area');
  const source    = allClients.filter(c => {
    if (activeTab === 'active')   return c['Status'] === 'Active';
    if (activeTab === 'archived') return ['Archived','Paid'].includes(c['Status']);
    if (activeTab === 'deleted')  return c['Status'] === 'Deleted';
    return true;
  });
  const filtered  = filter === 'all' ? source : source.filter(c => c['Artist'] === filter);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    const msgs = { active:'No active Afterpay invoices', archived:'No archived invoices', deleted:'No deleted invoices' };
    showState('empty', msgs[activeTab] || 'Nothing here yet');
    return;
  }

  stateArea.innerHTML = '';
  grid.innerHTML = filtered.map((c, i) => buildCard(c, i)).join('');
}

// ── BUILD CARD ──
function buildCard(c, i) {
  const artist  = c['Artist'] || 'Jackie';
  const theme   = ARTISTS[artist] || ARTISTS['Jackie'];
  const balance = parseFloat(c['Balance Due'])    || 0;
  const fee     = parseFloat(c['Afterpay Fee'])   || 0;
  const total   = parseFloat(c['Invoice Total'])  || 0;
  const days    = daysUntil(c['Appointment Date']);
  const status  = c['Status'] || 'Active';

  let urgencyLabel = '', urgencyClass = '';
  if (days !== null && days >= 0 && days <= 3)       { urgencyLabel = '🚨 ' + days + 'd away'; urgencyClass = 'urgent'; }
  else if (days !== null && days >= 0 && days <= 7)  { urgencyLabel = '⚡ ' + days + 'd away'; urgencyClass = 'soon'; }
  else if (days !== null && days >= 0 && days <= 30) { urgencyLabel = days + ' days away'; urgencyClass = 'upcoming'; }

  const apptStr = c['Appointment Date']
    ? new Date(c['Appointment Date'] + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
    : 'TBD';

  const statusClass = {
    Active:   'status-active',
    Paid:     'status-paid',
    Archived: 'status-archived',
    Deleted:  'status-deleted',
  }[status] || 'status-active';

  return `
    <div class="client-card" onclick="openModal('${escHtml(c['Client ID'])}')" style="animation-delay:${i*0.05}s">
      <div class="card-accent" style="background:linear-gradient(90deg,${theme.color},${theme.color}99);"></div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="client-name">${escHtml(c['Client Name']||'Unknown')}</div>
            <div class="artist-badge" style="background:${theme.bg};color:${theme.color};">
              <span style="width:6px;height:6px;border-radius:50%;background:${theme.color};display:inline-block;"></span>
              ${escHtml(artist)}
            </div>
          </div>
          <div class="appt-chip">
            <div class="appt-label">Appointment</div>
            <div class="appt-date">${apptStr}</div>
            ${urgencyLabel ? `<div class="appt-soon ${urgencyClass}">${urgencyLabel}</div>` : ''}
          </div>
        </div>

        <div class="amount-row">
          <div class="amount-block" style="background:${theme.bg};">
            <div class="amount-block-label" style="color:${theme.color};">Balance Due</div>
            <div class="amount-block-value" style="color:${theme.color};">${fmt(balance)}</div>
          </div>
          <div class="amount-block" style="background:#FDF0F0;">
            <div class="amount-block-label" style="color:#C97070;">AP Fee</div>
            <div class="amount-block-value" style="color:#C97070;">${fmt(fee)}</div>
          </div>
          <div class="amount-block" style="background:var(--green-light);">
            <div class="amount-block-label" style="color:var(--green-dark);">Invoice Total</div>
            <div class="amount-block-value" style="color:var(--green-dark);">${fmt(total)}</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="status-pill ${statusClass}">${status}</span>
          ${days !== null && days >= 0 ? `<span style="font-size:10px;color:${days<=7?'#C97070':'var(--chrome)'};">${days}d until appt</span>` : ''}
        </div>
      </div>
    </div>`;
}

// ── OPEN MODAL ──
function openModal(clientId) {
  const c = allClients.find(cl => cl['Client ID'] === clientId);
  if (!c) return;

  const theme   = ARTISTS[c['Artist']] || ARTISTS['Jackie'];
  const balance = parseFloat(c['Balance Due'])   || 0;
  const fee     = parseFloat(c['Afterpay Fee'])  || 0;
  const total   = parseFloat(c['Invoice Total']) || 0;
  const isActive = c['Status'] === 'Active';
  const apptStr  = c['Appointment Date']
    ? new Date(c['Appointment Date'] + 'T00:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })
    : 'TBD';

  document.getElementById('modal-overlay').innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="height:5px;background:linear-gradient(90deg,${theme.color},${theme.color}88);border-radius:20px 20px 0 0;"></div>
      <div style="padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
          <div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:26px;">${escHtml(c['Client Name']||'')}</div>
            <div style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;background:${theme.bg};color:${theme.color};font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;">
              <span style="width:6px;height:6px;border-radius:50%;background:${theme.color};display:inline-block;"></span>
              ${escHtml(c['Artist']||'')}
            </div>
          </div>
          <button onclick="closeModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--chrome);">✕</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
          <div style="background:var(--cream);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--chrome);margin-bottom:2px;">Appointment</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:15px;">${apptStr}</div>
          </div>
          <div style="background:var(--cream);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--chrome);margin-bottom:2px;">Status</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:15px;color:${isActive?'var(--green-dark)':'var(--chrome)'};">${c['Status']}</div>
          </div>
        </div>

        <div style="background:linear-gradient(135deg,rgba(61,153,112,0.08),rgba(61,153,112,0.03));border:1px solid var(--green-mid);border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;">
          <div style="font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--chrome);margin-bottom:4px;">Invoice Amount Sent to Client</div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--green-dark);line-height:1;">${fmt(total)}</div>
          <div style="font-size:11px;color:var(--chrome);margin-top:4px;font-style:italic;">via Square Afterpay</div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;">
          <div style="background:${theme.bg};border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:${theme.color};margin-bottom:2px;">Balance Due</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:18px;color:${theme.color};">${fmt(balance)}</div>
          </div>
          <div style="background:#FDF0F0;border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#C97070;margin-bottom:2px;">Afterpay Fee</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:18px;color:#C97070;">${fmt(fee)}</div>
          </div>
          <div style="background:var(--green-light);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--green-dark);margin-bottom:2px;">Invoice Total</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--green-dark);">${fmt(total)}</div>
          </div>
        </div>

        ${isActive ? `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--chrome);margin-bottom:4px;font-weight:500;">Actions</div>
          <button onclick="markPaid('${clientId}')" style="padding:14px;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;letter-spacing:0.06em;">✓ Mark as Paid &amp; Archive</button>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button onclick="archiveClient('${clientId}')" style="padding:12px;background:#f5f0f0;border:1.5px solid #e0d0d4;border-radius:12px;font-size:12px;font-weight:500;color:var(--ink-soft);cursor:pointer;">📦 Archive</button>
            <button onclick="deleteClient('${clientId}')" style="padding:12px;background:#fdf0f0;border:1.5px solid #f0c8c8;border-radius:12px;font-size:12px;font-weight:500;color:#c97070;cursor:pointer;">🗑 Delete</button>
          </div>
        </div>` : `
        <div style="padding:12px;background:var(--green-light);border-radius:12px;text-align:center;font-size:12px;color:var(--green-dark);font-weight:500;">
          ✓ This invoice is ${c['Status']}
        </div>`}
      </div>
    </div>

  document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

// ── ACTIONS ──
function markPaid(clientId) {
  if (!confirm('Mark this invoice as paid? Jackie will receive a record by email.')) return;
  closeModal();
  updateStatus(clientId, 'Paid');
  sendAction('archiveAfterPayClient', { clientId, reason: 'Paid' });
}

function archiveClient(clientId) {
  if (!confirm('Archive this invoice? Jackie will receive a record by email.')) return;
  closeModal();
  updateStatus(clientId, 'Archived');
  sendAction('archiveAfterPayClient', { clientId, reason: 'Archived' });
}

function deleteClient(clientId) {
  if (!confirm('Delete this invoice? Jackie will receive a record before deletion.')) return;
  closeModal();
  updateStatus(clientId, 'Deleted');
  sendAction('deleteAfterPayClient', { clientId });
}

function updateStatus(clientId, status) {
  const c = allClients.find(cl => cl['Client ID'] === clientId);
  if (c) c['Status'] = status;
  renderStats();
  renderGrid(activeFilter);
}

// ── TAB + FILTER ──
function switchTab(tab) {
  activeTab = tab;
  ['active','archived','deleted'].forEach(t => document.getElementById('tab-'+t).classList.toggle('active', t===tab));
  renderGrid(activeFilter);
}

function filterBy(artist) {
  activeFilter = artist;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.artist === artist));
  renderGrid(artist);
}

// ── JSONP ──
let cbId = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb     = 'apDash_' + (++cbId);
    const sep    = url.includes('?') ? '&' : '?';
    const script = document.createElement('script');
    script.src   = url + sep + 'callback=' + cb;
    const timer  = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 10000);
    window[cb]   = data => { cleanup(); clearTimeout(timer); resolve(data); };
    script.onerror = () => { cleanup(); clearTimeout(timer); reject(new Error('error')); };
    function cleanup() { if(script.parentNode) script.parentNode.removeChild(script); delete window[cb]; }
    document.head.appendChild(script);
  });
}

function sendAction(action, data) {
  return new Promise(resolve => {
    const cb = 'apAct_' + Date.now();
    const params = new URLSearchParams({ action, callback: cb, ...data });
    const script = document.createElement('script');
    script.src   = SHEET_URL + '?' + params;
    window[cb]   = () => { if(script.parentNode) script.parentNode.removeChild(script); delete window[cb]; resolve(); };
    script.onerror = () => resolve();
    setTimeout(() => resolve(), 8000);
    document.head.appendChild(script);
  });
}

// ── HELPERS ──
function fmt(n)    { return '$' + (n||0).toFixed(2); }
function daysUntil(d) {
  if (!d) return null;
  const appt  = new Date(d + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((appt - today) / 86400000);
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setRefreshing(v) { document.querySelector('.refresh-btn').classList.toggle('spinning', v); }
function showState(type, msg) {
  const grid = document.getElementById('grid');
  const area = document.getElementById('state-area');
  if (type === 'loading') {
    grid.innerHTML = '';
    area.innerHTML = `<div class="state-container"><div class="state-icon">🌿</div><div class="state-title">Loading invoices...</div><div class="state-sub">Pulling from the sheet</div></div>`;
  } else if (type === 'error') {
    area.innerHTML = `<div class="state-container"><div class="state-icon">✕</div><div class="state-title">Couldn't connect</div><div class="state-sub">Check your connection and try refreshing</div></div>`;
  } else if (type === 'empty') {
    area.innerHTML = `<div class="state-container"><div class="state-icon">✨</div><div class="state-title">${msg||'No invoices yet'}</div><div class="state-sub">All caught up!</div></div>`;
  }
}

// Init
loadDashboard();
</script>
