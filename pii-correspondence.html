<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correspondence — Pretty in Ink</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream:     #FDF7F5;
  --white:     #FFFFFF;
  --ink:       #1C1213;
  --ink-soft:  #5C4449;
  --chrome:    #B8A8AC;
  --border:    rgba(180,140,150,0.14);
  --shadow-sm: 0 2px 12px rgba(100,40,60,0.07);
  --shadow-md: 0 6px 32px rgba(100,40,60,0.13);
  --jackie:    #D4748F;
  --jackie-bg: #FDF0F3;
  --jackie-mid:#F2C8D4;
  --jackie-dark:#A84F68;
}

html, body {
  min-height: 100vh;
  background: var(--cream);
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(ellipse at 90% 0%, rgba(212,116,143,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 5% 90%, rgba(139,107,181,0.07) 0%, transparent 45%),
    var(--cream);
  padding-bottom: 80px;
}

/* ── NAV ── */
.nav {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 16px 16px 0;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--white);
  border: 1.5px solid var(--jackie-mid);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
  text-decoration: none;
  letter-spacing: 0.06em;
  transition: all 0.18s;
}
.nav-link:hover        { border-color: var(--jackie); color: var(--jackie); }
.nav-link.active       { background: var(--jackie); border-color: var(--jackie); color: var(--white); }

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 32px 24px 24px;
}

.header-eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--jackie);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(28px, 5vw, 44px);
  color: var(--ink);
  line-height: 1;
}
.header h1 em { font-style: italic; color: var(--jackie); }

.header-meta {
  font-size: 12px;
  color: var(--chrome);
  margin-top: 8px;
  font-weight: 300;
}

.header::after {
  content: '';
  display: block;
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, var(--jackie-mid), var(--jackie));
  margin: 16px auto 0;
  border-radius: 2px;
}

/* ── TOOLBAR ── */
.toolbar {
  max-width: 900px;
  margin: 0 auto 20px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.action-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.refresh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  background: var(--white);
  border: 1.5px solid var(--jackie-mid);
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.18s;
}
.refresh-btn:hover { border-color: var(--jackie); color: var(--jackie); }

.primary-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 20px;
  background: var(--jackie);
  border: 1.5px solid var(--jackie);
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--white);
  cursor: pointer;
  transition: all 0.18s;
}
.primary-btn:hover { background: var(--jackie-dark); border-color: var(--jackie-dark); }

/* ── SEARCH ── */
.search-wrap {
  max-width: 900px;
  margin: 0 auto 16px;
  padding: 0 20px;
}

.search-input {
  width: 100%;
  padding: 11px 18px;
  border: 1.5px solid var(--border);
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  background: var(--white);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.18s;
}
.search-input:focus { outline: none; border-color: var(--jackie-mid); }

/* ── FILTERS ── */
.filter-row {
  max-width: 900px;
  margin: 0 auto 20px;
  padding: 0 20px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--chrome);
  font-weight: 500;
  margin-right: 4px;
}

.filter-btn {
  padding: 7px 16px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-btn:hover  { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.filter-btn.active { background: var(--ink); border-color: var(--ink); color: var(--white); font-weight: 600; }
.filter-btn[data-filter="inbound"].active  { background: #3A7850; border-color: #3A7850; }
.filter-btn[data-filter="outbound"].active { background: #2A6A9A; border-color: #2A6A9A; }
.filter-btn[data-filter="open"].active     { background: #A86028; border-color: #A86028; }

/* ── RESULT COUNT ── */
.result-count {
  max-width: 900px;
  margin: 0 auto 10px;
  padding: 0 20px;
  font-size: 11px;
  color: var(--chrome);
  letter-spacing: 0.06em;
}

/* ── CORR LIST ── */
.corr-list {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── CORR CARD ── */
.corr-card {
  background: var(--white);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
  animation: fadeUp 0.25s ease both;
}
.corr-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

.corr-card-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 4px 0 0 4px;
}

.corr-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  position: relative;
  padding-left: 22px;
}
.corr-card-header:hover { background: rgba(212,116,143,0.03); }

.channel-icon { font-size: 18px; flex-shrink: 0; }

.dir-badge {
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
}
.dir-inbound  { background: #E8F5EF; color: #3A7850; border: 1px solid #BCE0C8; }
.dir-outbound { background: #EFF6FC; color: #2A6A9A; border: 1px solid #B8D8F0; }

.corr-meta { flex: 1; min-width: 0; }
.corr-subject {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 400;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
.corr-sub {
  font-size: 11px;
  color: var(--chrome);
  margin-top: 3px;
  font-weight: 300;
}

.status-pip {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pip-open      { background: #D4853A; }
.pip-sent      { background: #4A90C4; }
.pip-responded { background: #5A9E6F; }
.pip-closed    { background: var(--chrome); }

.corr-card-body {
  display: none;
  padding: 14px 18px 18px 22px;
  border-top: 1px solid var(--border);
}
.corr-card-body.open { display: block; }

.corr-body-text {
  font-size: 13px;
  color: var(--ink-soft);
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--cream);
  border-radius: 10px;
  padding: 12px 14px;
  line-height: 1.6;
  margin-bottom: 10px;
  font-weight: 300;
}

.corr-body-meta {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--chrome);
}
.corr-body-meta strong { color: var(--ink-soft); font-weight: 500; }

/* ── STATE BOXES ── */
.state-box { text-align: center; padding: 60px 20px; color: var(--chrome); }
.state-box .icon { font-size: 36px; margin-bottom: 12px; }
.state-box .msg  { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--ink); margin-bottom: 6px; }
.state-box .sub  { font-size: 12px; font-weight: 300; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(28,18,19,0.55);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--white);
  border-radius: 24px;
  width: min(480px, 100%);
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 28px 24px;
  box-shadow: 0 20px 80px rgba(100,40,60,0.25);
  margin: auto;
}

.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
}

.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 300;
  color: var(--ink);
}
.modal-title em { font-style: italic; color: var(--jackie); }

.modal-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--cream);
  font-size: 14px;
  color: var(--chrome);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.modal-close:hover { border-color: var(--jackie-mid); color: var(--jackie); }

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--chrome);
  font-weight: 500;
  margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--cream);
  transition: border-color 0.18s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--jackie-mid);
  background: var(--white);
}
.field textarea { resize: vertical; min-height: 70px; }
.field .hint { font-size: 11px; color: var(--chrome); margin-top: 4px; font-weight: 300; }

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.modal-btn {
  padding: 10px 22px;
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s;
  border: 1.5px solid;
}
.modal-btn-secondary { background: var(--white); color: var(--ink-soft); border-color: var(--border); }
.modal-btn-secondary:hover { border-color: var(--jackie-mid); }
.modal-btn-primary { background: var(--jackie); color: var(--white); border-color: var(--jackie); }
.modal-btn-primary:hover { background: var(--jackie-dark); border-color: var(--jackie-dark); }
.modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.msg-error   { color: #C97070; font-size: 12px; margin-top: 8px; display: none; padding: 8px 12px; background: #FDF0F0; border-radius: 8px; border: 1px solid #F0C8C8; }
.msg-success { color: #3A7850; font-size: 12px; margin-top: 8px; display: none; padding: 8px 12px; background: #E8F5EF; border-radius: 8px; border: 1px solid #BCE0C8; }

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2.5px solid var(--jackie-mid);
  border-top-color: var(--jackie);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .toolbar, .search-wrap, .filter-row, .result-count, .corr-list { padding: 0 12px; }
}
</style>
</head>
<body>

<div class="nav">
  <a href="index.html" class="nav-link">🏠 Home</a>
  <a href="pii-appointments.html" class="nav-link">📅 Appointments</a>
  <a href="pii-correspondence.html" class="nav-link active">✉️ Correspondence</a>
</div>

<div class="header">
  <div class="header-eyebrow">Pretty in Ink · The Femmepire</div>
  <h1>Correspondence <em>Log</em></h1>
  <div class="header-meta" id="header-meta">Loading…</div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="action-group">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-filter="all"       onclick="setFilter(this)">All</button>
    <button class="filter-btn"        data-filter="inbound"   onclick="setFilter(this)">Inbound</button>
    <button class="filter-btn"        data-filter="outbound"  onclick="setFilter(this)">Outbound</button>
    <button class="filter-btn"        data-filter="open"      onclick="setFilter(this)">⚠ Needs Reply</button>
    <button class="filter-btn"        data-filter="email"     onclick="setFilter(this)">Email</button>
    <button class="filter-btn"        data-filter="phone"     onclick="setFilter(this)">Phone</button>
    <button class="filter-btn"        data-filter="dm"        onclick="setFilter(this)">DM</button>
    <button class="filter-btn"        data-filter="in-person" onclick="setFilter(this)">In-person</button>
  </div>
  <div class="action-group">
    <button class="refresh-btn" onclick="loadCorrespondence()">↻ Refresh</button>
    <button class="primary-btn" onclick="openModal('logModal')">+ Log Interaction</button>
    <button class="primary-btn" onclick="openModal('emailModal')">✉ Send Email</button>
  </div>
</div>

<!-- Search -->
<div class="search-wrap">
  <input class="search-input" type="text" id="searchBox" placeholder="Search by client ID, notes, or channel…" oninput="filterCards()">
</div>

<div class="result-count" id="resultCount"></div>
<div class="corr-list" id="corrList">
  <div class="state-box"><div class="spinner"></div> Loading…</div>
</div>


<!-- Log Interaction Modal -->
<div class="modal-overlay" id="logModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Log <em>Interaction</em></div>
      <button class="modal-close" onclick="closeModal('logModal')">✕</button>
    </div>

    <div class="field">
      <label>Client ID</label>
      <input type="text" id="log_clientId" placeholder="e.g. C_001">
    </div>
    <div class="field">
      <label>Channel</label>
      <select id="log_channel">
        <option value="phone">Phone call</option>
        <option value="sms">SMS / text</option>
        <option value="dm">DM (Instagram / Facebook)</option>
        <option value="in-person">In-person</option>
        <option value="email">Email (manual)</option>
      </select>
    </div>
    <div class="field">
      <label>Direction</label>
      <select id="log_direction">
        <option value="inbound">Inbound — client contacted us</option>
        <option value="outbound">Outbound — we contacted client</option>
      </select>
    </div>
    <div class="field">
      <label>Your name</label>
      <input type="text" id="log_staffName" placeholder="Jackie, Nicole, Tressa…">
    </div>
    <div class="field">
      <label>Notes / summary</label>
      <textarea id="log_summary" placeholder="What was discussed?"></textarea>
    </div>
    <div class="field">
      <label>Linked Inquiry ID <span style="font-weight:300;text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="text" id="log_inquiryId" placeholder="INQ_001">
    </div>
    <div class="field">
      <label>Linked Appointment ID <span style="font-weight:300;text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="text" id="log_apptId" placeholder="APPT_001">
    </div>

    <div class="msg-error"   id="logError"></div>
    <div class="msg-success" id="logSuccess"></div>

    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" onclick="closeModal('logModal')">Cancel</button>
      <button class="modal-btn modal-btn-primary"   onclick="submitLog()" id="logSubmitBtn">Save</button>
    </div>
  </div>
</div>


<!-- Send Email Modal -->
<div class="modal-overlay" id="emailModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Send <em>Email</em></div>
      <button class="modal-close" onclick="closeModal('emailModal')">✕</button>
    </div>

    <div class="field">
      <label>Client ID</label>
      <input type="text" id="em_clientId" placeholder="e.g. C_001">
    </div>
    <div class="field">
      <label>To (email address)</label>
      <input type="email" id="em_toEmail" placeholder="client@email.com">
    </div>
    <div class="field">
      <label>Your name</label>
      <input type="text" id="em_staffName" placeholder="Jackie, Nicole, Tressa…">
    </div>
    <div class="field">
      <label>Subject</label>
      <input type="text" id="em_subject" placeholder="e.g. Your appointment on June 3rd">
    </div>
    <div class="field">
      <label>Message</label>
      <textarea id="em_body" placeholder="Write your message here…"></textarea>
    </div>
    <div class="field">
      <label>Linked Appointment ID <span style="font-weight:300;text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="text" id="em_apptId" placeholder="APPT_001">
    </div>

    <div class="msg-error"   id="emailError"></div>
    <div class="msg-success" id="emailSuccess"></div>

    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" onclick="closeModal('emailModal')">Cancel</button>
      <button class="modal-btn modal-btn-primary"   onclick="submitEmail()" id="emailSubmitBtn">Send + Log</button>
    </div>
  </div>
</div>


<script>
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbwUU2aV5fMpjMWieN8j28pnRW8B4ZgjepdVgONbTKzbONETzmUsjKT-JswnwnT_13Eq/exec';

let allRows      = [];
let activeFilter = 'all';
let cbId         = 0;

const CHANNEL_ICONS  = { email:'✉️', phone:'📞', sms:'💬', dm:'📱', 'in-person':'🤝' };
const CHANNEL_LABELS = { email:'Email', phone:'Phone', sms:'SMS', dm:'DM', 'in-person':'In-person' };

// ── JSONP (matches existing dashboard pattern) ─────────
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb     = 'corrDash_' + (++cbId);
    const sep    = url.includes('?') ? '&' : '?';
    const script = document.createElement('script');
    script.src   = url + sep + 'callback=' + cb;
    const timer  = setTimeout(() => { cleanup(); reject(new Error('Timed out')); }, 15000);
    window[cb]   = data => { cleanup(); clearTimeout(timer); resolve(data); };
    script.onerror = () => { cleanup(); clearTimeout(timer); reject(new Error('Network error')); };
    function cleanup() { if (script.parentNode) script.parentNode.removeChild(script); delete window[cb]; }
    document.head.appendChild(script);
  });
}

// ── LOAD ──────────────────────────────────────────────
async function loadCorrespondence() {
  document.getElementById('corrList').innerHTML =
    '<div class="state-box"><div class="spinner"></div> Loading…</div>';
  try {
    const data = await jsonp(EXEC_URL + '?action=getCorrespondence');
    if (!data.success) throw new Error(data.error || 'Bad response');
    allRows = data.correspondence || [];
    render(allRows);
    document.getElementById('header-meta').textContent =
      allRows.length + ' entr' + (allRows.length === 1 ? 'y' : 'ies') +
      ' · Updated ' + new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  } catch (e) {
    document.getElementById('corrList').innerHTML =
      `<div class="state-box"><div class="icon">✕</div><div class="msg">Couldn't connect</div><div class="sub">${e.message}</div></div>`;
  }
}

// ── RENDER ────────────────────────────────────────────
function render(rows) {
  const list = document.getElementById('corrList');
  document.getElementById('resultCount').textContent =
    rows.length === 0 ? '' : rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies');

  if (rows.length === 0) {
    list.innerHTML = '<div class="state-box"><div class="icon">✉️</div><div class="msg">No correspondence yet</div><div class="sub">Log a phone call or send an email above</div></div>';
    return;
  }

  list.innerHTML = rows.map((row, i) => {
    const icon    = CHANNEL_ICONS[row.channel]  || '💬';
    const chanLbl = CHANNEL_LABELS[row.channel] || row.channel;
    const msgDate = row.messageAt ? new Date(row.messageAt) : null;
    const dateStr = msgDate
      ? msgDate.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })
      : '—';
    const timeStr = msgDate
      ? msgDate.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })
      : '';
    const staff   = row.staffName ? ' · ' + row.staffName : '';
    const status  = row.status || 'sent';
    const barColor = row.direction === 'inbound' ? '#5A9E6F' : '#4A90C4';
    const pipClass = 'pip-' + status;

    return `
      <div class="corr-card"
           data-direction="${row.direction}"
           data-channel="${row.channel}"
           data-status="${status}"
           data-text="${esc((row.body||'') + ' ' + row.clientId + ' ' + (row.staffName||'')).toLowerCase()}"
           style="animation-delay:${i * 0.03}s">
        <div class="corr-card-header" onclick="toggleCard(this)">
          <div class="corr-card-bar" style="background:${barColor};"></div>
          <span class="channel-icon">${icon}</span>
          <span class="dir-badge dir-${row.direction}">${row.direction}</span>
          <div class="corr-meta">
            <div class="corr-subject">${esc(row.body ? row.body.split('\n')[0].substring(0,80) : '(no notes)')}</div>
            <div class="corr-sub">${row.clientId} · ${chanLbl} · ${dateStr} ${timeStr}${staff}</div>
          </div>
          <span class="status-pip ${pipClass}" title="${status}"></span>
        </div>
        <div class="corr-card-body">
          ${row.body ? `<div class="corr-body-text">${esc(row.body)}</div>` : ''}
          <div class="corr-body-meta">
            <span>Status: <strong>${status}</strong></span>
            ${row.inquiryId ? `<span>Inquiry: <strong>${row.inquiryId}</strong></span>` : ''}
            ${row.apptId    ? `<span>Appt: <strong>${row.apptId}</strong></span>`       : ''}
            ${row.respondedAt ? `<span>Responded: <strong>${new Date(row.respondedAt).toLocaleDateString()}</strong></span>` : ''}
            <span>ID: ${row.corrId}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleCard(header) {
  header.nextElementSibling.classList.toggle('open');
}

// ── FILTER ────────────────────────────────────────────
function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  filterCards();
}

function filterCards() {
  const query = document.getElementById('searchBox').value.toLowerCase();
  const cards = document.querySelectorAll('.corr-card');
  let visible = 0;

  cards.forEach(card => {
    const dir    = card.dataset.direction;
    const chan   = card.dataset.channel;
    const status = card.dataset.status;
    const text   = card.dataset.text;
    let show = true;

    if (activeFilter !== 'all') {
      if      (activeFilter === 'open')     show = status === 'open';
      else if (activeFilter === 'inbound')  show = dir === 'inbound';
      else if (activeFilter === 'outbound') show = dir === 'outbound';
      else show = chan === activeFilter;
    }
    if (show && query) show = text.includes(query);
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });

  document.getElementById('resultCount').textContent =
    visible === 0 ? 'No results' : visible + ' entr' + (visible === 1 ? 'y' : 'ies');
}

// ── MODAL HELPERS ─────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.getElementById(id).querySelectorAll('.msg-error, .msg-success')
    .forEach(el => { el.style.display = 'none'; el.textContent = ''; });
}
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
});

// ── SUBMIT: LOG INTERACTION ────────────────────────────
async function submitLog() {
  const btn    = document.getElementById('logSubmitBtn');
  const errEl  = document.getElementById('logError');
  const okEl   = document.getElementById('logSuccess');
  errEl.style.display = okEl.style.display = 'none';

  const clientId = document.getElementById('log_clientId').value.trim();
  const summary  = document.getElementById('log_summary').value.trim();
  if (!clientId) { showMsg(errEl, 'Client ID is required.'); return; }
  if (!summary)  { showMsg(errEl, 'Notes are required.'); return; }

  btn.textContent = 'Saving…';
  btn.disabled = true;

  try {
    const params = new URLSearchParams({
      action:    'logCorrespondence',
      clientId,
      channel:   document.getElementById('log_channel').value,
      direction: document.getElementById('log_direction').value,
      summary,
      staffName: document.getElementById('log_staffName').value.trim(),
      inquiryId: document.getElementById('log_inquiryId').value.trim(),
      apptId:    document.getElementById('log_apptId').value.trim(),
    });
    const data = await jsonp(EXEC_URL + '?' + params);
    if (!data.success && data.status !== 'ok') throw new Error(data.error || data.message || 'Unknown error');
    showMsg(okEl, '✓ Logged successfully');
    setTimeout(() => { closeModal('logModal'); loadCorrespondence(); }, 1100);
  } catch (e) {
    showMsg(errEl, e.message);
  } finally {
    btn.textContent = 'Save';
    btn.disabled = false;
  }
}

// ── SUBMIT: SEND EMAIL ────────────────────────────────
async function submitEmail() {
  const btn   = document.getElementById('emailSubmitBtn');
  const errEl = document.getElementById('emailError');
  const okEl  = document.getElementById('emailSuccess');
  errEl.style.display = okEl.style.display = 'none';

  const clientId = document.getElementById('em_clientId').value.trim();
  const toEmail  = document.getElementById('em_toEmail').value.trim();
  const subject  = document.getElementById('em_subject').value.trim();
  const body     = document.getElementById('em_body').value.trim();
  if (!clientId) { showMsg(errEl, 'Client ID is required.'); return; }
  if (!toEmail)  { showMsg(errEl, 'Recipient email is required.'); return; }
  if (!subject)  { showMsg(errEl, 'Subject is required.'); return; }
  if (!body)     { showMsg(errEl, 'Message body is required.'); return; }

  btn.textContent = 'Sending…';
  btn.disabled = true;

  try {
    const params = new URLSearchParams({
      action:    'sendEmail',
      clientId,
      toEmail,
      subject,
      body,
      staffName: document.getElementById('em_staffName').value.trim(),
      apptId:    document.getElementById('em_apptId').value.trim(),
    });
    const data = await jsonp(EXEC_URL + '?' + params);
    if (!data.success && data.status !== 'ok') throw new Error(data.error || data.message || 'Unknown error');
    showMsg(okEl, '✓ Sent and logged!');
    setTimeout(() => { closeModal('emailModal'); loadCorrespondence(); }, 1200);
  } catch (e) {
    showMsg(errEl, e.message);
  } finally {
    btn.textContent = 'Send + Log';
    btn.disabled = false;
  }
}

function showMsg(el, msg) { el.textContent = msg; el.style.display = 'block'; }
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadCorrespondence();
</script>
